# Psalm static analysis.
#
# A single Psalm run (type + taint analysis) drives all three outcomes:
#   * GitHub annotations - Psalm auto-selects the github format on stdout.
#   * SARIF upload        - results go to the Security tab / Code Scanning.
#   * Failing CI          - the build fails on any error-level finding.
#
# Psalm exits 0 even on findings when it writes a report inside GitHub Actions
# (vimeo/psalm@6e39c24), so the build is failed from the SARIF after it has
# been uploaded, not from the exit code. Upload first so findings are recorded
# even on a failing run.

name: Psalm

on:
  push:
    branches:
      - master
      - '2.*'
      - '1.x'
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: psalm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  psalm:
    name: Psalm static analysis (types + taint)
    runs-on: ubuntu-latest
    steps:
      - name: Audit outbound calls
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run Psalm
        run: ./vendor/bin/psalm --taint-analysis --report=psalm.sarif --threads=2

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: psalm.sarif
          category: psalm

      - name: Fail on Psalm findings
        run: |
          errors=$(jq '[.runs[].results[] | select(.level == "error")] | length' psalm.sarif)
          echo "Psalm error-level findings: $errors"
          if [ "$errors" -gt 0 ]; then
            echo "::error::Psalm reported $errors error-level finding(s) - see annotations and the Security tab."
            exit 1
          fi
